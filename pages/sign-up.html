<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="../styles/sign-up-styles.css">
</head>
<body>
    <header>
        <img src="../assets/images/logo.svg" alt="Логотип">
        <h1>MyBook</h1>
    </header>
    <main>
        <form id="registerForm" novalidate>
            <legend>Регистрация</legend>

            <label>ФИО
                <input id="fullName" type="text" placeholder="example">
                <span class="error-message" id="fullNameError"></span>
            </label>

            <label>Почта
                <input id="email" type="email" placeholder="example@ru">
                <span class="error-message" id="emailError"></span>
            </label>

            <label>Логин
                <input id="login" type="text" placeholder="example">
                <span class="error-message" id="loginError"></span>
            </label>

            <label>Пароль
                <input id="password" type="password" placeholder="example">
                <span class="error-message" id="passwordError"></span>
            </label>

            <label>Повторите пароль
                <input id="confirmPassword" type="password" placeholder="example">
                <span class="error-message" id="confirmPasswordError"></span>
            </label>

            <button type="submit" id="but">Зарегистрироваться</button>
            <a href="sign-in.html">Есть аккаунт?</a>
        </form>
    </main>

    <script>
        const form = document.getElementById('registerForm');
        const fullNameInput = document.getElementById('fullName');
        const emailInput = document.getElementById('email');
        const loginInput = document.getElementById('login');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            document.getElementById('fullNameError').textContent = '';
            document.getElementById('emailError').textContent = '';
            document.getElementById('loginError').textContent = '';
            document.getElementById('passwordError').textContent = '';
            document.getElementById('confirmPasswordError').textContent = '';

            let hasErrors = false;

            if (fullNameInput.value.trim() === '') {
                document.getElementById('fullNameError').textContent = 'Заполните ФИО';
                hasErrors = true;
            }

            if (loginInput.value.trim() === '') {
                document.getElementById('loginError').textContent = 'Заполните логин';
                hasErrors = true;
            }

            if (emailInput.value.trim() === '') {
                document.getElementById('emailError').textContent = 'Заполните почту';
                hasErrors = true;
            } else if (!emailInput.value.includes('@') || !emailInput.value.includes('.')) {
               
                document.getElementById('emailError').textContent = 'Введите корректную почту (например, example@mail.ru)';
                hasErrors = true;
            }

            if (passwordInput.value === '') {
                document.getElementById('passwordError').textContent = 'Заполните пароль';
                hasErrors = true;
            } else if (passwordInput.value.length < 8) {
               
                document.getElementById('passwordError').textContent = 'Пароль должен содержать минимум 8 символов';
                hasErrors = true;
            }

            if (confirmPasswordInput.value === '') {
                document.getElementById('confirmPasswordError').textContent = 'Повторите пароль';
                hasErrors = true;
            } else if (passwordInput.value !== confirmPasswordInput.value) {
                
                document.getElementById('confirmPasswordError').textContent = 'Пароли не совпадают';
                hasErrors = true;
            }

           
            if (hasErrors) {
                return;
            }

          
            alert('Регистрация прошла успешно!');
            window.location.href = '../index.html';
        });
    </script>
</body>
</html>
